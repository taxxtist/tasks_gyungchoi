<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경최 할 일 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f4f2ec;--surface:#fffdf8;--ink:#2b2a26;--muted:#8a877d;
    --faint:#b5b2a8;--line:rgba(43,42,38,.10);--line2:rgba(43,42,38,.18);--r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:28px 18px 80px;line-height:1.5;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* gate */
  #gate{max-width:340px;margin:14vh auto 0;background:var(--surface);
    border:1px solid var(--line2);border-radius:var(--r);padding:26px 24px;text-align:center;}
  #gate h1{font-size:19px;font-weight:700;margin-bottom:6px;}
  #gate p{font-size:13px;color:var(--muted);margin-bottom:16px;}
  #gate input{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;
    border:1px solid var(--line2);border-radius:9px;outline:none;margin-bottom:10px;}
  #gate input:focus{border-color:var(--muted);}
  #gate button{width:100%;font-family:inherit;font-size:14px;padding:10px;cursor:pointer;
    background:#2b2a26;color:#fff;border:none;border-radius:9px;}
  #gate .err{color:#c0392b;font-size:12.5px;min-height:16px;margin-top:8px;}

  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;
    margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line2);}
  h1{font-size:25px;font-weight:700;letter-spacing:-.02em;}
  .sub{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .progress{text-align:right;}
  .progress .num{font-size:24px;font-weight:700;}
  .progress .lab{font-size:12px;color:var(--muted);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .btn{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line2);border-radius:9px;padding:7px 13px;cursor:pointer;transition:.12s;}
  .btn:hover{background:#efece4;} .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--muted);}
  .btn.danger{color:#c0392b;border-color:rgba(192,57,58,.45);}
  .btn.danger:hover{background:rgba(192,57,58,.08);}
  #status{font-size:12px;color:var(--faint);margin-left:auto;}
  #status.ok{color:#3d8168;} #status.warn{color:#b9770e;} #status.busy{color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:start;}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 16px 12px;border-top:4px solid var(--accent,var(--faint));position:relative;}
  .col-resize{position:absolute;top:0;right:-9px;width:14px;height:100%;cursor:ew-resize;z-index:4;}
  .col-resize::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:3px;height:32px;border-radius:3px;background:var(--line2);opacity:0;transition:.12s;}
  .col:hover .col-resize::after{opacity:.5;}
  .col-resize:hover::after{opacity:1;background:var(--muted);height:46px;}
  .col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .colgrab{flex:none;cursor:grab;color:var(--faint);font-size:12px;opacity:0;transition:.12s;user-select:none;}
  .col:hover .colgrab{opacity:.5;} .colgrab:active{cursor:grabbing;}
  .col.dragging{opacity:.4;}
  .col.colover-l{box-shadow:inset 3px 0 0 #2b2a26;} .col.colover-r{box-shadow:inset -3px 0 0 #2b2a26;}
  .col-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--accent,var(--ink));
    border:none;background:none;font-family:inherit;outline:none;width:100%;}
  .col-title:focus{background:rgba(0,0,0,.04);border-radius:6px;}
  .col-count{font-size:12px;color:var(--faint);font-weight:600;white-space:nowrap;}
  .col-clr{flex:none;width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);
    cursor:pointer;padding:0;opacity:0;transition:.12s;}
  .col:hover .col-clr{opacity:.85;} .col-clr:hover{opacity:1;transform:scale(1.15);}
  .col-clock{flex:none;background:none;border:1px solid var(--line2);border-radius:6px;font-size:10px;
    cursor:pointer;padding:1px 4px;opacity:0;transition:.12s;line-height:1.4;}
  .col:hover .col-clock{opacity:.7;} .col-clock.on{opacity:1;background:#eef3fb;border-color:#9cc0e8;}
  .col.timed{background:linear-gradient(180deg,#eff4fb 0%,var(--surface) 70px);}
  .col.timed .col-clock{opacity:1;}
  .planbadge{flex:none;font-size:12px;opacity:.9;cursor:default;}
  .tm{flex:none;border:1px solid var(--line2);border-radius:5px;font-family:inherit;font-size:11.5px;
    color:var(--ink);padding:2px 4px;background:var(--surface);width:104px;min-width:104px;margin-top:1px;box-sizing:content-box;}
  #planner{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;
    align-items:flex-start;justify-content:center;padding:5vh 16px;}
  .planner-box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;
    overflow:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .planner-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
    padding-bottom:12px;border-bottom:1px solid var(--line2);}
  .planner-head b{font-size:17px;}
  #planClose{border:none;background:none;font-size:16px;cursor:pointer;color:var(--muted);}
  .pl-row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);}
  .pl-time-in{flex:none;width:78px;border:1px solid var(--line2);border-radius:5px;font-family:inherit;
    font-size:12px;font-weight:600;color:var(--ink);padding:3px 5px;background:var(--surface);text-align:center;}
  .pl-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .pl-txt{flex:1;font-size:14px;line-height:1.4;outline:none;padding:2px 3px;border-radius:5px;}
  .pl-txt:focus{background:rgba(0,0,0,.04);}
  .pl-row.done .pl-txt{text-decoration:line-through;color:var(--faint);}
  .pl-row.failed .pl-txt{text-decoration:line-through;color:#c0392b;opacity:.75;}
  .pl-x{flex:none;border:none;background:none;color:var(--faint);cursor:pointer;font-size:13px;opacity:0;transition:.12s;}
  .pl-row:hover .pl-x{opacity:.6;} .pl-x:hover{opacity:1;color:#c0392b;}
  .pl-sub{font-size:12px;color:var(--muted);margin:14px 0 2px;font-weight:600;}
  .pl-empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;line-height:1.7;}
  .pl-add{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .pl-add select,.pl-add input{font-family:inherit;font-size:13px;border:1px solid var(--line2);
    border-radius:7px;padding:6px 8px;background:var(--surface);color:var(--ink);outline:none;}
  .pl-sel{flex:none;max-width:130px;}
  .pl-tin{flex:none;width:64px;text-align:center;}
  .pl-txin{flex:1;min-width:120px;}
  .pl-addbtn{flex:none;font-family:inherit;font-size:13px;border:none;border-radius:7px;
    background:#2b2a26;color:#fff;padding:7px 13px;cursor:pointer;}
  .pl-addbtn:hover{background:#43413b;}
  .pl-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-6px 0 14px;}
  .pl-qh{font-size:11.5px;color:var(--muted);}
  .pl-q{font-family:inherit;font-size:12.5px;border:1px solid var(--line2);border-radius:20px;
    background:var(--surface);cursor:pointer;padding:4px 11px;}
  .pl-q-lunch:hover{background:rgba(230,160,60,.15);border-color:#e0a53c;}
  .pl-q-ex:hover{background:rgba(60,160,100,.15);border-color:#3ca064;}
  .pl-row.pl-lunch{background:rgba(230,160,60,.12);border-radius:6px;}
  .pl-row.pl-exercise{background:rgba(60,160,100,.12);border-radius:6px;}
  .col-width{flex:none;display:inline-flex;align-items:center;gap:1px;background:var(--surface);
    border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
  .col-width .cwbtn{border:none;background:none;color:var(--muted);cursor:pointer;font-family:inherit;
    font-size:13px;line-height:1;width:18px;height:18px;padding:0;}
  .col-width .cwbtn:hover{background:#efece4;color:var(--ink);}
  .col-width .cwnum{font-size:11px;color:var(--muted);min-width:10px;text-align:center;font-weight:600;}
  .col-del{opacity:0;color:var(--faint);background:none;border:none;cursor:pointer;font-size:15px;transition:.12s;padding:2px 4px;}
  .col:hover .col-del{opacity:.6;} .col-del:hover{opacity:1;color:#c0392b;}
  ul{list-style:none;}
  .task{display:flex;align-items:flex-start;gap:9px;padding:5px 4px;border-radius:8px;transition:.1s;}
  .task:hover{background:rgba(0,0,0,.025);}
  .cb{appearance:none;-webkit-appearance:none;flex:none;width:17px;height:17px;margin-top:2px;
    border:1.6px solid var(--line2);border-radius:5px;cursor:pointer;position:relative;transition:.12s;}
  .cb:hover{border-color:var(--muted);}
  .cb:checked{background:#3d8168;border-color:#3d8168;}
  .cb:checked::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);}
  .st{flex:none;width:17px;height:17px;margin-top:2px;border:1.6px solid var(--line2);border-radius:5px;
    cursor:pointer;background:none;padding:0;font-size:11px;line-height:1;display:flex;align-items:center;
    justify-content:center;transition:.12s;color:#fff;font-weight:700;}
  .st:hover{border-color:var(--muted);}
  .st.st1{background:#3d8168;border-color:#3d8168;}
  .st.st2{background:#c0392b;border-color:#c0392b;}
  .txt{flex:1;font-size:13.7px;border:none;background:none;outline:none;font-family:inherit;
    color:var(--ink);line-height:1.45;padding:1px 2px;white-space:pre-wrap;word-break:break-word;min-height:1.3em;}
  .txt:focus{background:rgba(0,0,0,.04);border-radius:5px;}
  .txt:empty:not(:focus)::before{content:"";}
  .task.done .txt{text-decoration:line-through;color:var(--faint);}
  .task.failed .txt{text-decoration:line-through;color:#c0392b;opacity:.75;}
  .mk{flex:none;width:17px;margin-top:1px;color:var(--faint);text-align:center;font-size:13px;line-height:1.4;}
  .note .txt{color:var(--ink);}
  .task.selected{background:rgba(192,57,58,.12);box-shadow:inset 0 0 0 1px rgba(192,57,58,.4);}
  #marquee{position:fixed;border:1px solid rgba(192,57,58,.7);background:rgba(192,57,58,.10);
    z-index:60;pointer-events:none;display:none;border-radius:4px;}
  #selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;
    background:#2b2a26;color:#fff;border-radius:11px;padding:9px 12px 9px 16px;
    display:none;align-items:center;gap:12px;box-shadow:0 6px 22px rgba(0,0,0,.28);font-size:13.5px;}
  #selbar b{font-weight:600;}
  #selbar button{font-family:inherit;font-size:13px;border:none;border-radius:8px;cursor:pointer;padding:6px 12px;}
  #selDel{background:#c0392b;color:#fff;} #selCancel{background:rgba(255,255,255,.16);color:#fff;}
  .x{opacity:0;flex:none;background:none;border:none;cursor:pointer;color:var(--faint);
    font-size:15px;line-height:1;transition:.12s;padding:0 2px;}
  .task:hover .x{opacity:.55;} .x:hover{opacity:1;color:#c0392b;}
  .fmt{display:flex;gap:3px;align-items:center;flex:none;opacity:0;transition:.12s;}
  .task:hover .fmt{opacity:.75;}
  .fmt button{border:1px solid var(--line2);background:var(--surface);border-radius:5px;cursor:pointer;
    font-family:inherit;line-height:1;padding:0;width:18px;height:18px;font-size:11px;color:var(--muted);}
  .fmt .fb.on{background:#2b2a26;color:#fff;border-color:#2b2a26;}
  .fmt .fc{width:14px;height:14px;border-radius:50%;}
  .lk{flex:none;font-size:10px;margin-top:2px;opacity:.75;cursor:default;}
  .drag{flex:none;width:13px;text-align:center;cursor:grab;color:var(--faint);font-size:12px;
    line-height:1.4;margin-top:1px;opacity:0;transition:.12s;user-select:none;}
  .task:hover .drag{opacity:.45;} .drag:active{cursor:grabbing;}
  .task.dragging{opacity:.4;}
  .task.dragover-top{box-shadow:inset 0 2px 0 #2b2a26;}
  .task.dragover-bot{box-shadow:inset 0 -2px 0 #2b2a26;}
  .task.copymode.dragover-top{box-shadow:inset 0 2px 0 #0f6e56;}
  .task.copymode.dragover-bot{box-shadow:inset 0 -2px 0 #0f6e56;}
  .btn.on-mode{background:#2b2a26;color:#fff;border-color:#2b2a26;}
  .selecting .txt{pointer-events:none;} .selecting .cb{pointer-events:none;}
  .selecting .drag,.selecting .fmt,.selecting .x{display:none!important;}
  .selecting .task{cursor:pointer;}
  .add{font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;
    padding:6px 4px;font-family:inherit;margin-top:2px;}
  .add:hover{color:var(--ink);}
  .addcol{border:1.5px dashed var(--line2);border-radius:var(--r);background:none;color:var(--muted);
    font-family:inherit;font-size:14px;cursor:pointer;min-height:90px;display:flex;
    align-items:center;justify-content:center;transition:.12s;}
  .addcol:hover{background:rgba(0,0,0,.02);color:var(--ink);border-color:var(--muted);}
  .hint{font-size:11px;color:var(--faint);}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <h1>경최 할 일 보드</h1>
    <p>비밀번호를 입력하세요</p>
    <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="pwBtn">열기</button>
    <div class="err" id="pwErr"></div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <div>
        <h1>경최 할 일 보드</h1>
        <div class="sub" id="today"></div>
      </div>
      <div class="progress"><div class="num" id="pnum">0</div><div class="lab">완료</div></div>
    </header>
    <div class="toolbar">
      <button class="btn ghost" id="hideDone">완료 항목 숨기기</button>
      <button class="btn danger" id="delDone" style="display:none;">완료 항목 삭제</button>
      <button class="btn ghost" id="calBtn">📅 캘린더 열기</button>
      <button class="btn ghost" id="planBtn">🗓 오늘 일정표</button>
      <button class="btn ghost" id="moreBtn" title="더보기">⋯ 더보기</button>
      <span id="moreMenu" style="display:none;align-items:center;gap:8px;">
        <button class="btn ghost" id="selMode">항목 선택</button>
        <button class="btn ghost" id="colsBtn">열: 자동</button>
        <button class="btn ghost" id="exportBtn">내보내기</button>
        <button class="btn ghost" id="importBtn">불러오기</button>
        <button class="btn ghost" id="reset">처음 상태로 초기화</button>
      </span>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
      <span class="hint" style="align-self:center;">· 항목 클릭해서 수정 · 자동 저장</span>
      <span id="status"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="marquee"></div>
  <div id="planner">
    <div class="planner-box">
      <div class="planner-head"><b>🗓 오늘 일정표</b><button id="planClose">✕</button></div>
      <div id="plannerBody"></div>
    </div>
  </div>
  <div id="selbar">
    <span><b id="selCount">0</b>개 선택됨</span>
    <button id="selDel">삭제</button>
    <button id="selCancel">취소</button>
  </div>

</div>

<script>
/* ====== 설정: 본인 Apps Script 웹앱 URL을 여기에 붙여넣으세요 ====== */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwgSpf-Ato8ceyicv2IEl03wf1u-EPUQSAmyNMh1_uAacCzYOmtlwqy9WKw7lpaSOJy/exec";
/* ============================================================ */

const CONFIGURED = /^https?:\/\//.test(ENDPOINT) && !/APPS_SCRIPT/.test(ENDPOINT);

const CACHE_KEY = "gc_board_cache";
let pw = sessionStorage.getItem("gc_pw") || "";
let state = [];
let hideDone = false;
let saveTimer = null;
let pendingFocus = null;
let dragSrc = null;
let dragType = null;
let dragColSrc = null;
let dragFromSelected = false;
let selectMode = false;
let undoStack = [];
let colMode = localStorage.getItem("gc_cols")||"auto";
let linkClip = null;

const DEFAULT = [
  {title:"오늘 바로", accent:"#c0392b", tasks:[
    {t:"17시 기장상담 예약자 문자 (업종·매출·특이사항)", d:1},
    {t:"비뇨기과 진료의뢰서 끊기 (진이 6/17 전)", d:1},
    {t:"탁감 3군데 발주 — 하이테크·효성·태양 (+추가 감평 서치)", d:1},
    {t:"민정님께 위임 넘기기 — 원천세·반기결산", d:1},
  ]},
  {title:"~6/10 마감", accent:"#b9770e", tasks:[
    {t:"이인숙 유흥주점 기한후신고 시작 [6/10]", d:0},
    {t:"원천세 발행 (민정) [6/10]", d:0},
    {t:"세금계산서 발행 (미수 → 다음 주)", d:0},
    {t:"운정빌 임대인 상속세 수수료 산정·답장 (이번 주)", d:0},
  ]},
  {title:"6월 고정 일정", accent:"#185fa5", tasks:[
    {t:"6/17 진이 대학병원", d:0},
    {t:"6/20 주형이 동생 결혼식", d:0},
    {t:"6/23 사무실 이전", d:0},
    {t:"구글캘린더 6월 전체 등록", d:0},
  ]},
  {title:"기장 · 거래처", accent:"#5f5e5a", tasks:[
    {t:"종소세 파일 정리 (소명 대비, 이번 주)", d:0},
    {t:"말리부드림 박미지 사업용카드 교체", d:0},
    {t:"비욘드아트 기장준비 — 계좌·카드·현금영수증·CMS", d:0},
    {t:"장시아 기장 해제", d:0},
    {t:"이정환 기장 제안 (8.8만)", d:0},
    {t:"투썸플레이스 기장 제안", d:0},
    {t:"네일코인·이엠컴퍼니 종소세 수수료 요청", d:0},
    {t:"티엔지에너지 미수금 수령 (투표 후)", d:0},
    {t:"르모노·까사 성실신고 준비", d:0},
    {t:"스케줄24·시아엔터 기장 정리", d:0},
    {t:"김민지 사업자등록 답변 (11만)", d:0},
    {t:"박창규 사업자등록 준비 (11만)", d:0},
    {t:"서다민 근로계약서·4대보험", d:0},
    {t:"디에이치시너지 반기결산 (민정)", d:0},
  ]},
  {title:"상속세 — 직접 집중", accent:"#0f6e56", tasks:[
    {t:"이미숙 계좌 — 매일 15분 (세무조사 대비, 습관)", d:0},
    {t:"양형균 보충적평가액 준비 (납부 대비)", d:0},

async function serverGet(){
  const r=await fetch(ENDPOINT+"?key="+encodeURIComponent(pw));
  const txt=(await r.text()).trim();
  if(txt==="AUTH_FAIL")throw new Error("auth");
  return txt?JSON.parse(txt):null;
}
async function serverPut(){
  setStatus("저장 중…","busy");
  try{
    await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({key:pw,data:state})});
    localStorage.setItem(CACHE_KEY,JSON.stringify(state));
    setStatus("저장됨 ✓","ok");
  }catch(e){
    localStorage.setItem(CACHE_KEY,JSON.stringify(state));

  }
}
function scheduleSave(){
  localStorage.setItem(CACHE_KEY,JSON.stringify(state));
  if(!CONFIGURED){setStatus("미리보기 — 이 기기에만 저장","warn");return;}
  setStatus("저장 중…","busy");

function genLink(){return "lnk"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function parseTime(str){
  if(!str)return "";
  let s=String(str);const pm=/오후|PM|pm/.test(s),am=/오전|AM|am/.test(s);
  s=s.replace(/[^0-9:]/g,"");if(!s)return "";
  let h,m;
  if(s.indexOf(":")>=0){const p=s.split(":");h=parseInt(p[0],10);m=parseInt(p[1],10);}
  else if(s.length<=2){h=parseInt(s,10);m=0;}
  else if(s.length===3){h=parseInt(s.slice(0,1),10);m=parseInt(s.slice(1),10);}
  else{h=parseInt(s.slice(0,2),10);m=parseInt(s.slice(2,4),10);}
  if(isNaN(h))return "";if(isNaN(m))m=0;
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;
  h=((h%24)+24)%24;m=Math.max(0,Math.min(59,m));
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function fmtTime(hhmm){
  if(!hhmm)return "";
  const p=hhmm.split(":");let h=parseInt(p[0],10);const m=p[1]||"00";
  const ap=h<12?"오전":"오후";let hh=h%12;if(hh===0)hh=12;
  return ap+" "+hh+":"+m;
}
function itemHTML(task){
  let t=task.t==null?"":String(task.t);
  if(!/<[a-z!/]/i.test(t)){
    t=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
    const st=[];
    if(task.b)st.push("font-weight:700");
    if(task.s)st.push("text-decoration:line-through");
    if(task.c)st.push("color:"+task.c);
    if(st.length&&t)t='<span style="'+st.join(";")+'">'+t+'</span>';
  }
  return t;
}

function snapshot(){
  const s=JSON.stringify(state);
  if(undoStack[undoStack.length-1]===s)return;
  undoStack.push(s);if(undoStack.length>80)undoStack.shift();
}
function undo(){
  if(!undoStack.length){setStatus("더 되돌릴 게 없어요","warn");return;}
  state=JSON.parse(undoStack.pop());
  scheduleSave();render();setStatus("되돌림 ↩","ok");
}

function moveTask(src,dstCi,dstTi){
  if(!src||!state[src.ci]||!state[dstCi])return;
  const task=state[src.ci].tasks[src.ti];
  if(!task)return;
  snapshot();
  state[src.ci].tasks.splice(src.ti,1);
  if(src.ci===dstCi&&src.ti<dstTi)dstTi--;
  if(dstTi<0)dstTi=0;if(dstTi>state[dstCi].tasks.length)dstTi=state[dstCi].tasks.length;
  state[dstCi].tasks.splice(dstTi,0,task);
  dragSrc=null;scheduleSave();render();
}

function linkCopyTask(src,dstCi,dstTi){
  if(!src||!state[src.ci]||!state[dstCi]){dragSrc=null;return;}
  const orig=state[src.ci].tasks[src.ti];
  if(!orig){dragSrc=null;return;}
  if(!confirm("이 항목을 여기 '연결복사'할까요?\n(체크·글자가 원본과 같이 움직여요)")){dragSrc=null;return;}
  snapshot();
  if(!orig.link)orig.link=genLink();
  if(dstTi<0)dstTi=0;if(dstTi>state[dstCi].tasks.length)dstTi=state[dstCi].tasks.length;
  state[dstCi].tasks.splice(dstTi,0,{t:orig.t,d:orig.d,n:orig.n,link:orig.link});
  dragSrc=null;scheduleSave();render();
}

function moveMany(dstCi,dstTi){

      const bH=document.createElement("button");bH.className="fb fh";bH.textContent="🖍";bH.title="형광펜 (드래그 후 클릭)";
      bH.onmousedown=e=>{e.preventDefault();snapshot();tx.focus();document.execCommand("styleWithCSS",false,true);
        if(!document.execCommand("hiliteColor",false,hcolors[hci]))document.execCommand("backColor",false,hcolors[hci]);
        task.t=tx.innerHTML;scheduleSave();hci=(hci+1)%hcolors.length;};
      const bL=document.createElement("button");bL.className="fb fl";bL.textContent="🔗";bL.title="연결복사 → 다른 섹션서 붙여넣기";
      bL.onmousedown=e=>{e.preventDefault();
        if(!task.link){snapshot();task.link=genLink();scheduleSave();}
        linkClip={t:task.t,d:task.d,n:task.n,link:task.link};
        setStatus("연결복사됨 — 다른 섹션 아래 '📋 붙여넣기'","ok");render();};
      fmt.append(bB,bS,bC,bH,bL);
      li.append(tx,fmt,x);ul.append(li);
    });
    cEl.append(ul);
    const addRow=document.createElement("div");addRow.style.display="flex";addRow.style.gap="4px";
    const add=document.createElement("button");add.className="add";add.textContent="+ 할 일";
    add.onclick=()=>{snapshot();col.tasks.push({t:"",d:0});pendingFocus={ci:ci,ti:col.tasks.length-1};scheduleSave();render();focusPending();};
    const addN=document.createElement("button");addN.className="add";addN.textContent="+ 메모";
    addN.onclick=()=>{snapshot();col.tasks.push({t:"",n:1});pendingFocus={ci:ci,ti:col.tasks.length-1};scheduleSave();render();focusPending();};
    addRow.append(add,addN);
    if(linkClip){
      const addP=document.createElement("button");addP.className="add";addP.textContent="📋 붙여넣기";addP.title="연결복사한 항목을 여기 붙여넣기";
      addP.onclick=()=>{snapshot();col.tasks.push({t:linkClip.t,d:linkClip.d,n:linkClip.n,link:linkClip.link});scheduleSave();render();};
      addRow.append(addP);
    }
    cEl.append(addRow);

    const rz=document.createElement("div");rz.className="col-resize";rz.title="끌어서 너비 조절";
    rz.addEventListener("mousedown",function(e){
      e.preventDefault();e.stopPropagation();
      const gs=getComputedStyle($("grid"));
      const tracks=gs.gridTemplateColumns.split(" ").map(parseFloat).filter(v=>!isNaN(v));
      const unit=tracks.length?Math.min.apply(null,tracks):310;
      const gap=parseFloat(gs.columnGap)||16;
      const left=cEl.getBoundingClientRect().left;
      let cur=col.span||1;
      document.body.style.userSelect="none";document.body.style.cursor="ew-resize";
      function mv(ev){
        const w=ev.clientX-left;
        let n=Math.round((w+gap)/(unit+gap));
        n=Math.max(1,Math.min(3,n));
        if(n!==cur){cur=n;cEl.style.gridColumn=n>1?"span "+n:"";cwNum.textContent=n;}
      }
      function up(){
        document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);
        document.body.style.userSelect="";document.body.style.cursor="";
        if((col.span||1)!==cur){snapshot();col.span=cur;scheduleSave();render();}
      }
      document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    });
    cEl.append(rz);

    grid.append(cEl);
  });
  const addCol=document.createElement("button");addCol.className="addcol";addCol.textContent="+ 섹션 추가";
  addCol.onclick=()=>{snapshot();state.push({title:"새 섹션",accent:"#8a877d",tasks:[{t:"",d:0}]});scheduleSave();render();};
  grid.append(addCol);
  $("pnum").textContent=done+" / "+total;
  const dd=$("delDone");const resolved=done+failed;
  if(resolved>0){dd.style.display="";dd.textContent="완료·못함 삭제 ("+resolved+")";}
  else{dd.style.display="none";}
}

$("hideDone").onclick=function(){hideDone=!hideDone;
  this.textContent=hideDone?"완료 항목 보이기":"완료 항목 숨기기";render();};
$("delDone").onclick=function(){
  let n=0;state.forEach(c=>n+=c.tasks.filter(t=>!t.n&&(t.d===1||t.d===2)).length);
  if(!n)return;
  if(!confirm("완료·못함 처리된 "+n+"개 항목을 삭제할까요?"))return;
  snapshot();
  state.forEach(c=>{c.tasks=c.tasks.filter(t=>!(!t.n&&(t.d===1||t.d===2)));});
  scheduleSave();render();
};
$("reset").onclick=function(){
  if(confirm("모든 내용을 처음 상태로 되돌릴까요? (모든 기기에 적용됩니다)")){
    snapshot();state=JSON.parse(JSON.stringify(DEFAULT));scheduleSave();render();}};
$("exportBtn").onclick=function(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  const d=new Date();a.download="할일보드_백업_"+d.getFullYear()+(d.getMonth()+1)+d.getDate()+".json";
  a.click();URL.revokeObjectURL(a.href);
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=function(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(Array.isArray(d)){if(confirm("지금 내용을 불러온 파일로 교체할까요?")){snapshot();state=d;scheduleSave();render();}}
    else alert("올바른 백업 파일이 아니에요.");
  }catch(err){alert("파일을 읽을 수 없어요.");}};
  r.readAsText(f);e.target.value="";
};
function applyCols(){
  $("grid").style.gridTemplateColumns = colMode==="auto"
    ? "repeat(auto-fill,minmax(310px,1fr))"
    : "repeat("+colMode+",minmax(0,1fr))";
  $("colsBtn").textContent="열: "+(colMode==="auto"?"자동":colMode);
}
$("colsBtn").onclick=function(){
  const order=["auto","1","2","3"];
  colMode=order[(order.indexOf(colMode)+1)%order.length];
  localStorage.setItem("gc_cols",colMode);
  applyCols();
};
applyCols();
$("calBtn").onclick=()=>window.open("https://calendar.google.com/calendar/u/0/r","_blank");
function planRow(r){
  const row=document.createElement("div");row.className="pl-row"+(r.task.d===1?" done":"")+(r.task.d===2?" failed":"")+(r.task.kind?" pl-"+r.task.kind:"");
  const tm=document.createElement("input");tm.className="pl-time-in";tm.value=fmtTime(r.task.time);tm.placeholder="시간";
  tm.addEventListener("focus",()=>{tm.value=r.task.time||"";tm.select();});
  tm.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();tm.blur();}});
  tm.addEventListener("blur",()=>{const nv=parseTime(tm.value);if(nv!==(r.task.time||"")){snapshot();r.task.time=nv;scheduleSave();render();openPlanner();}else{tm.value=fmtTime(r.task.time);}});
  const dot=document.createElement("span");dot.className="pl-dot";dot.style.background=r.col.accent||"#b5b2a8";dot.title=r.col.title||"";
  const cb=makeStateBtn(r.task,()=>{scheduleSave();render();openPlanner();},null);
  const tx=document.createElement("div");tx.className="pl-txt";tx.contentEditable="true";tx.innerHTML=itemHTML(r.task);
  tx.addEventListener("input",()=>{r.task.t=tx.innerHTML;syncLinkText(r.task);scheduleSave();});
  tx.addEventListener("blur",()=>render());
  const x=document.createElement("button");x.className="pl-x";x.textContent="✕";x.title="삭제";
  x.onclick=()=>{snapshot();r.col.tasks.splice(r.ti,1);scheduleSave();render();openPlanner();};
  row.append(tm,dot,cb,tx,x);return row;
}
function openPlanner(){
  const body=$("plannerBody");body.innerHTML="";
  const timedCols=state.map((c,i)=>({c,i})).filter(x=>x.c.timed);
  if(!timedCols.length){
    body.innerHTML='<div class="pl-empty">먼저 섹션 제목 옆 🕐를 켜서 "시간표 섹션"을 만들어주세요.<br>(딥워크·루틴·자투리처럼요)</div>';
    $("planner").style.display="flex";return;
  }
  const form=document.createElement("div");form.className="pl-add";
  const sel=document.createElement("select");sel.className="pl-sel";
  timedCols.forEach(x=>{const o=document.createElement("option");o.value=x.i;o.textContent=x.c.title||"(제목없음)";sel.appendChild(o);});
  const tin=document.createElement("input");tin.className="pl-tin";tin.placeholder="시간";
  const txin=document.createElement("input");txin.className="pl-txin";txin.placeholder="할 일 내용 입력 후 Enter";
  const addb=document.createElement("button");addb.className="pl-addbtn";addb.textContent="+ 추가";
  const doAdd=()=>{const ci=+sel.value;const tt=txin.value.trim();if(!tt||!state[ci])return;
    snapshot();state[ci].tasks.push({t:tt,d:0,time:parseTime(tin.value)});scheduleSave();render();
    txin.value="";tin.value="";openPlanner();};
  addb.onclick=doAdd;
  tin.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();txin.focus();}});
  txin.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doAdd();}});
  form.append(sel,tin,txin,addb);body.appendChild(form);

  const quick=document.createElement("div");quick.className="pl-quick";
  const addSpecial=(kind,label)=>{
    let ti2=state.findIndex(c=>c.timed&&/자투리/.test(c.title||""));
    if(ti2<0)ti2=state.findIndex(c=>c.timed);
    if(ti2<0)return;
    snapshot();state[ti2].tasks.push({t:label,d:0,time:parseTime(tin.value),kind:kind});
    scheduleSave();render();tin.value="";openPlanner();
  };
  const bLunch=document.createElement("button");bLunch.className="pl-q pl-q-lunch";bLunch.textContent="🍚 점심";
  bLunch.onclick=()=>addSpecial("lunch","🍚 점심");
  const bEx=document.createElement("button");bEx.className="pl-q pl-q-ex";bEx.textContent="🏃 운동";
  bEx.onclick=()=>addSpecial("exercise","🏃 운동");
  const qh=document.createElement("span");qh.className="pl-qh";qh.textContent="빠른 추가 (시간 넣고 클릭 → 자투리로):";
  quick.append(qh,bLunch,bEx);body.appendChild(quick);

  const rows=[];
  state.forEach((col,ci)=>{if(!col.timed)return;col.tasks.forEach((t,ti)=>{if(!t.n)rows.push({col,ci,task:t,ti});});});
  const timed=rows.filter(r=>r.task.time).sort((a,b)=>a.task.time.localeCompare(b.task.time));
  const untimed=rows.filter(r=>!r.task.time);
  const list=document.createElement("div");list.className="pl-list";
  if(!timed.length&&!untimed.length){const e=document.createElement("div");e.className="pl-empty";e.textContent="위에서 일정을 추가해보세요.";list.appendChild(e);}
  timed.forEach(r=>list.appendChild(planRow(r)));
  if(untimed.length){
    const h=document.createElement("div");h.className="pl-sub";h.textContent="시간 미정";list.appendChild(h);
    untimed.forEach(r=>list.appendChild(planRow(r)));
  }
  body.appendChild(list);
  $("planner").style.display="flex";
}
$("planBtn").onclick=openPlanner;
$("planClose").onclick=()=>{$("planner").style.display="none";};
$("planner").onclick=e=>{if(e.target===$("planner"))$("planner").style.display="none";};
$("moreBtn").onclick=function(){
  const m=$("moreMenu");const open=m.style.display!=="none";
  m.style.display=open?"none":"inline-flex";
  this.classList.toggle("on-mode",!open);
};

function startApp(){
  $("gate").style.display="none";$("app").style.display="block";
  const d=new Date();
  $("today").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일";
  const cache=localStorage.getItem(CACHE_KEY);
  if(cache){try{state=JSON.parse(cache);render();}catch(e){}}
  if(!CONFIGURED){
    if(!cache){state=JSON.parse(JSON.stringify(DEFAULT));render();}
    setStatus("미리보기 모드 (서버 미연결)","warn");
    return;
  }
  setStatus("불러오는 중…","busy");
  serverGet().then(data=>{
    if(data===null){state=JSON.parse(JSON.stringify(DEFAULT));render();serverPut();}
    else{state=data;render();setStatus("동기화됨 ✓","ok");}
  }).catch(e=>{
    if(e.message==="auth"){sessionStorage.removeItem("gc_pw");pw="";
      location.reload();}
    else{setStatus("서버 연결 안 됨 — 이 기기 저장본 표시","warn");
      if(!cache){state=JSON.parse(JSON.stringify(DEFAULT));render();}}
  });
}

function tryGate(){
  const v=$("pwInput").value.trim();
  if(!v){return;}
  pw=v;$("pwErr").textContent="확인 중…";
  fetch(ENDPOINT+"?key="+encodeURIComponent(pw)).then(r=>r.text()).then(txt=>{
    if(txt.trim()==="AUTH_FAIL"){$("pwErr").textContent="비밀번호가 틀렸어요.";pw="";return;}
    sessionStorage.setItem("gc_pw",pw);startApp();
  }).catch(e=>{$("pwErr").textContent="서버에 연결할 수 없어요. URL을 확인하세요.";});
}
$("pwBtn").onclick=tryGate;
$("pwInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryGate();});

if(!CONFIGURED){startApp();}
else if(pw){startApp();}
else{$("pwInput").focus();}

/* ===== 선택(드래그 / 탭) → 일괄 삭제 ===== */
function clearSel(){document.querySelectorAll(".task.selected").forEach(t=>t.classList.remove("selected"));$("selbar").style.display="none";}
function updateSelbar(){
  const n=document.querySelectorAll(".task.selected").length;
  if(n>0){$("selCount").textContent=n;$("selbar").style.display="flex";}
  else{$("selbar").style.display="none";}
}
$("selCancel").onclick=clearSel;
function deleteSelected(){
  const sel=document.querySelectorAll(".task.selected");
  if(!sel.length)return;
  snapshot();
  const victims=new Set();
  sel.forEach(li=>{const ci=+li.dataset.ci,ti=+li.dataset.ti;
    if(state[ci]&&state[ci].tasks[ti])victims.add(state[ci].tasks[ti]);});
  state.forEach(col=>{col.tasks=col.tasks.filter(t=>!victims.has(t));});
  clearSel();scheduleSave();render();
}
$("selDel").onclick=deleteSelected;

document.addEventListener("keydown",function(e){
  const inField=document.activeElement&&(/TEXTAREA|INPUT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!inField){e.preventDefault();undo();return;}
  if((e.key==="Delete"||e.key==="Backspace")&&!inField){
    const sel=document.querySelectorAll(".task.selected");
    if(sel.length){e.preventDefault();deleteSelected();}
  }
});
$("selMode").onclick=function(){
  selectMode=!selectMode;
  $("grid").classList.toggle("selecting",selectMode);
  this.classList.toggle("on-mode",selectMode);
  this.textContent=selectMode?"선택 끝내기":"항목 선택";
  clearSel();render();
};
(function(){
  const mq=$("marquee");
  let sx=0,sy=0,dragging=false;
  function isInteractive(el){return el.closest("textarea,input,select,button,.add,.addcol,.col-title,.drag,.colgrab,.col-resize,[contenteditable],.planner-box");}
  document.addEventListener("mousedown",function(e){
    if(e.button!==0)return;
    if(selectMode)return;
    if($("planner").style.display==="flex")return;
    if($("app").style.display==="none")return;
    if(isInteractive(e.target))return;
    if(e.target.closest("#selbar"))return;
    clearSel();
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    e.preventDefault();
    document.body.style.userSelect="none";
    dragging=true;sx=e.clientX;sy=e.clientY;
    mq.style.display="block";mq.style.left=sx+"px";mq.style.top=sy+"px";mq.style.width="0px";mq.style.height="0px";
  });
  document.addEventListener("mousemove",function(e){
    if(!dragging)return;
    const x=Math.min(e.clientX,sx),y=Math.min(e.clientY,sy);
    const w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
    mq.style.left=x+"px";mq.style.top=y+"px";mq.style.width=w+"px";mq.style.height=h+"px";
    const r={left:x,top:y,right:x+w,bottom:y+h};
    document.querySelectorAll(".task").forEach(t=>{
      const b=t.getBoundingClientRect();
      const hit=!(b.right<r.left||b.left>r.right||b.bottom<r.top||b.top>r.bottom);
      t.classList.toggle("selected",hit);
    });
  });
  document.addEventListener("mouseup",function(e){
    if(!dragging)return;
    dragging=false;mq.style.display="none";document.body.style.userSelect="";
    updateSelbar();
  });
})();

/* ===== 드래그 중 화면 가장자리에서 자동 스크롤 ===== */
(function(){
  let dragY=0,raf=null;
  document.addEventListener("dragover",function(e){
    if(!dragType)return;
    dragY=e.clientY;
    if(!raf)raf=requestAnimationFrame(loop);
  });
  function loop(){
    if(!dragType){raf=null;return;}
    const m=100,vh=window.innerHeight;let d=0;
    if(dragY<m)d=-Math.max(5,(m-dragY)/3);
    else if(dragY>vh-m)d=Math.max(5,(dragY-(vh-m))/3);
    if(d)window.scrollBy(0,d);
    raf=requestAnimationFrame(loop);
  }
})();
</script>
